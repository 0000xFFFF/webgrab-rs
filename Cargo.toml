[package]
name = "webgrab"
version = "2.0.0"
edition = "2021"
description = "Web page file scanner / downloader"

[dependencies]
csv = "1"
clap = { version = "4", features = ["derive"] }
html-escape = "0.2"
percent-encoding = "2"
regex = "1"
sha2 = "0.10"
ureq = "2"
url = "2"
arboard = { version = "3", default-features = false, optional = true }

[target.'cfg(windows)'.dependencies]
enable-ansi-support = "0.2"

[features]
default = ["clipboard"]
clipboard = ["dep:arboard"]

[profile.release]
opt-level = 3
lto = true
strip = true
